name = "osmos-life"
compatibility_date = "2026-01-01"
pages_build_output_dir = "."

# Integracao do SAC (/api/sac) com o modulo SAC do Nexus. Nao sao sigilosas.
# A chave fica como segredo no painel: SAC_API_KEY (Producao e Preview).
[vars]
SAC_API_URL = "https://nexus.bradel.com.br/modulo-sac/api/v1"
SAC_ACOMPANHAR_URL = "https://nexus.bradel.com.br/modulo-sac/acompanhar"

[[d1_databases]]
binding = "DB"
database_name = "osmos-questionarios"
database_id = "6bad8a35-3b38-4c18-a01c-209d50e10d60"

# Banco dedicado ao blog (posts). O restante do site (questionários, leads,
# raio-x) continua no binding DB acima.
[[d1_databases]]
binding = "BLOG_DB"
database_name = "blog_osmos"
database_id = "7cdc999c-a158-4935-8672-7b7f50838cf4"

# redeploy
